name: Check links & publish

on:
  # Every day at 10:00 UTC (6 am Eastern in summer, 5 am in winter).
  schedule:
    - cron: "0 10 * * *"
  # Whenever you change resources.toml (or anything else) on GitHub.
  push:
    branches: [main]
  # Manual button: GitHub → Actions → "Check links & publish" → Run workflow.
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [check, approve]
        default: check
      resource_id:
        description: "Resource id to approve (from the email), or 'all' for everything awaiting review"
        required: false
      keep_saved_copy:
        description: "When approving a PDF, keep your old saved copy instead of replacing it"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Approve resource
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'approve'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOURCE_ID: ${{ inputs.resource_id }}
          KEEP_COPY: ${{ inputs.keep_saved_copy }}
        run: |
          ARGS=""
          if [ "$KEEP_COPY" = "true" ]; then ARGS="--keep-copy"; fi
          if [ "$RESOURCE_ID" = "all" ]; then
            python scripts/approve.py --all-pending $ARGS
          else
            python scripts/approve.py "$RESOURCE_ID" $ARGS
          fi

      - name: Check links
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'check'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python scripts/check_links.py

      - name: Save results
        run: |
          git config user.name "link-checker"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data files
          if ! git diff --cached --quiet; then
            git commit -m "Update link check results"
            git push
          fi

      - name: Build website
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
