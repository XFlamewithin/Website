# ======================================================================
#  RESOURCES — this is the only file you need to edit to add links.
# ======================================================================
#
#  To add a resource, copy one of the blocks below, paste it where you
#  want it to appear, and change the text. Each block starts with
#  [[resource]]. Resources appear on the website in the same order as
#  in this file, grouped by "section" and then by "topic".
#
#    section  – "patients" or "clinicians" (which part of the page)
#    topic    – the heading it appears under (e.g. "Osteoporosis").
#               Resources with the same topic are grouped together.
#    title    – the text of the link
#    url      – the web address
#    source   – (optional) who publishes it, shown in grey
#    note     – (optional) a short line of extra explanation
#    page     – (optional) the web page the file is posted on, e.g. the
#               government page that links to a PDF. That page is checked
#               daily too: if it changes you are asked to review, and if it
#               stops linking to the file (a sign the file was replaced or
#               withdrawn) the resource is hidden until you approve it.
#    check    – (optional) "auto" (default) or "off". Use "off" for
#               websites that block automatic checking.
#    icon     – (optional) the small picture beside the topic heading.
#               Chosen automatically from the topic name; set it on any
#               one resource in a topic to override. Choices: drop, heart,
#               heart-pulse, pulse, child, dumbbell, bone, ribbon, pill,
#               apple, lungs, brain, stethoscope, syringe, document
#    id       – (optional) a short unique name. If left out it is made
#               from the title. Used for saved copies and approvals.
#
#  Text must be inside "double quotes". Lines starting with # are notes
#  for you and are ignored.
# ======================================================================


